spec: resources/spec.md
language: ru
defects:
  - id: D1
    kind: security (A07 account enumeration)
    where: "п. 2.4"
    what: "Разные ответы для найденного и ненайденного email раскрывают, зарегистрирован ли адрес"
    all_of:
      - "перечисл|enumerat|раскрыва|узнать.{0,40}(зарегистр|существ)|утечк|разные (сообщения|ответы)|одинаков"
  - id: D2
    kind: security (A07 token lifetime)
    where: "п. 3.1"
    what: "Не задан срок действия токена"
    all_of:
      - "токен|ссылк"
      - "срок|время жизни|истека|TTL|действител"
  - id: D3
    kind: security (A07 token reuse)
    where: "п. 3.1 / 4.1"
    what: "Не сказано, одноразовый ли токен и аннулируются ли старые ссылки"
    all_of:
      - "одноразов|повторн|многократ|reuse|аннулир|инвалид|старые ссылк|предыдущ"
  - id: D4
    kind: security (A07 rate limiting)
    where: "п. 2"
    what: "Нет ограничения на число запросов восстановления (спам письмами, перебор)"
    all_of:
      - "огранич|лимит|rate.?limit|частот|перебор|спам|количеств[оа] (запрос|попыт)"
  - id: D5
    kind: untestable requirement
    where: "п. 3.3"
    what: "«Надёжный пароль» не определён — нет правил длины/состава"
    all_of:
      - "надёжн|надежн"
      - "длин|символ|правил|критери|не определ|измерим|проверяем"
  - id: D6
    kind: missing behaviour
    where: "п. 4"
    what: "Не сказано, завершаются ли активные сессии после смены пароля"
    all_of:
      - "сесси|выход на других|разлогин|активн"
