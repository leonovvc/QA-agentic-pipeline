[project]
name = "qa-agentic-pipeline-tools"
version = "1.0.0"
description = "Static validation and artifact-contract checks for the qa-agentic-pipeline Claude Code plugin"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
